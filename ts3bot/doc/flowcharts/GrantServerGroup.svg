	<desc>Flowchart diagram model</desc>
	<g id="_w_T-YkQ0EeavkcsFwndrbA">
		<defs>
			<linearGradient id="greyGradient" x1="0%" y1="0%" x2="0%" y2="100%" spreadMethod="pad">
				<stop offset="0%" stop-color="#FFF" stop-opacity="1"/>
				<stop offset="100%" stop-color="#E5E5E5" stop-opacity="1"/>
				
			</linearGradient>
			<linearGradient id="packageGradient" x1="0%" y1="0%" x2="0%" y2="100%" spreadMethod="pad">
				<stop offset="0%" stop-color="#FFF" stop-opacity="1"/>
				<stop offset="100%" stop-color="#EFE9DE" stop-opacity="1"/>
				
			</linearGradient>
			<linearGradient id="StartShapeWidget" x1="0%" y1="0%" x2="0%" y2="100%" spreadMethod="pad">
				<stop offset="0%" stop-color="#c2e08f" stop-opacity="1"/>
				<stop offset="100%" stop-color="#7ec601" stop-opacity="1"/>
				
			</linearGradient>
			<linearGradient id="StoredDataShapeWidget" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="pad">
				<stop offset="0%" stop-color="#fff9c2" stop-opacity="1"/>
				<stop offset="100%" stop-color="#FFF" stop-opacity="1"/>
				
			</linearGradient>
			<linearGradient id="ActionShapeWidget" x1="0%" y1="0%" x2="0%" y2="100%" spreadMethod="pad">
				<stop offset="0%" stop-color="#FFF" stop-opacity="1"/>
				<stop offset="100%" stop-color="#B3E0FF" stop-opacity="1"/>
				
			</linearGradient>
			<linearGradient id="EndShapeWidget" x1="0%" y1="0%" x2="0%" y2="100%" spreadMethod="pad">
				<stop offset="0%" stop-color="#FF0000" stop-opacity="1"/>
				<stop offset="100%" stop-color="#900000" stop-opacity="1"/>
				
			</linearGradient>
			
		</defs>
		<g id="_4XRMoCZiEDSBK_8y2G5dyg" transform="translate(60 142)">
			<rect x="0" y="0" width="100" height="40" rx="20" ry="20" fill="url(#StartShapeWidget)" stroke="#888888" stroke-width="1"/>
			<path fill="url(#StartShapeWidget)" stroke-width="1" stroke="#888888"/>
			<text y="7" text-anchor="middle" fill="#000000">
				<tspan x="51" dy="12">Grant server</tspan>
				<tspan x="51" dy="12">group.</tspan>
				
			</text>
			
		</g>
		<g id="_8BNu0CZiEDSBK_8y2G5dyg" transform="translate(50 20)">
			<path d="M33.75 1L119 1C86.25 1 86.25 89 119 89L33.75 89C1 89 1 1 33.75 1" fill="url(#StoredDataShapeWidget)" stroke-width="1" stroke="#888888"/>
			<text y="8" text-anchor="middle" fill="#000000">
				<tspan x="52" dy="12">Needs</tspan>
				<tspan x="52" dy="12">game world</tspan>
				<tspan x="52" dy="12">and</tspan>
				<tspan x="52" dy="12">affiliated</tspan>
				<tspan x="52" dy="12">server</tspan>
				<tspan x="52" dy="12">group Id.</tspan>
				
			</text>
			
		</g>
		<g id="_FniI0CZjEDSBK_8y2G5dyg" transform="translate(214 132)">
			<rect x="0" y="0" width="130" height="60" rx="0" ry="0" fill="url(#ActionShapeWidget)" stroke="#888888" stroke-width="1"/>
			<text y="5" text-anchor="middle" fill="#000000">
				<tspan x="66" dy="12">Remove all server</tspan>
				<tspan x="66" dy="12">groups except the</tspan>
				<tspan x="66" dy="12">one affiliated with the</tspan>
				<tspan x="66" dy="12">game world.</tspan>
				
			</text>
			
		</g>
		<g id="_MZpV0CZjEDSBK_8y2G5dyg" transform="translate(214 30)">
			<path d="M26.25 1L129 1C103.75 1 103.75 69 129 69L26.25 69C1 69 1 1 26.25 1" fill="url(#StoredDataShapeWidget)" stroke-width="1" stroke="#888888"/>
			<text y="10" text-anchor="middle" fill="#000000">
				<tspan x="59" dy="12">A list of related</tspan>
				<tspan x="59" dy="12">server groups</tspan>
				<tspan x="59" dy="12">can be gathered</tspan>
				<tspan x="59" dy="12">from the config.</tspan>
				
			</text>
			
		</g>
		<g id="_TWWpQCZjEDSBK_8y2G5dyg" transform="translate(398 142)">
			<rect x="0" y="0" width="100" height="40" rx="20" ry="20" fill="url(#EndShapeWidget)" stroke="#888888" stroke-width="1"/>
